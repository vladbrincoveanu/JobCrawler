[project]
name = "jobcrawler"
version = "0.1.0"
description = "Job listings crawler + storage"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "respx>=0.21",
    "ruff>=0.5",
]
# scripts/scout.py + scripts/buckets.py + scripts/sources/* (the CV-matching
# scout tool, shelled out to by dashboard/app/api/scout/route.ts) are a
# separate CLI from the crawler/dashboard and need their own runtime deps,
# which were previously undeclared -- `pip install -e ".[dev]"` per the
# README never actually got you a working scout.py.
scout = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pypdf>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["crawler"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
